# Candidate: durata-civile (issue #1)
# Fonte: Ministero della Giustizia - DG Statistica
# URL: https://datiestatistiche.giustizia.it/page/it/durata-dei-procedimenti-civili
# File: Durata_SICID_20142025.xlsx + Durata_SIECIC_20142025.xlsx
# Script: unite_durata_civile.py — scarica entrambi e unisce in CSV con registro.
# Copertura: 2014-2025. 3 livelli di aggregazione (Circondariale/Distrettuale/Nazionale).

root: "../../out"
schema_version: 1

dataset:
  name: "durata_civile"
  source_id: "giustizia_statistiche"
  tags: [giustizia, civile, durata, siecic, sicid, statistiche-giudiziarie]
  category: giustizia
  years: [2025]
  time_coverage:
    start_year: 2014
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python scripts/unite_durata_civile.py --output raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    header: true
  sql: "sql/clean.sql"
  required_columns: [registro, distretto, sede, livello_aggregazione, materia, anno, durata_media_gg]
  validate:
    min_rows: 20000
    not_null:
      - registro
      - anno
      - sede
      - materia

mart:
  tables:
    - name: "durata_civile"
      sql: "sql/mart.sql"
    - name: "mart_nazionale_trend"
      sql: "sql/mart_nazionale_trend.sql"
  required_tables:
    - "durata_civile"
    - "mart_nazionale_trend"
  validate:
    table_rules:
      durata_civile:
        # Registro separa i due gradi di merito; livello base = Circondariale
        primary_key: [anno, registro, distretto, sede, materia]
        min_rows: 5000
      mart_nazionale_trend:
        primary_key: [anno, registro, materia]
        min_rows: 100

validation:
  fail_on_error: true
