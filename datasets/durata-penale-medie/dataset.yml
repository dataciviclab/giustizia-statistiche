# Candidate: durata-penale-medie (issue #2)
# Fonte: Ministero della Giustizia - DG Statistica
# URL: https://datiestatistiche.giustizia.it/it/durata_dei_procedimenti.page
# File: Durate_medie_penali_20142025.csv (export CSV dello omonimo foglio XLSX)
# Copertura: 2014-2025. Il CSV ha ~1M righe di padding vuoto — ~17k di dati.

root: "../../out"
schema_version: 1

dataset:
  name: "durata_penale_medie"
  source_id: "giustizia_statistiche"
  tags: [giustizia, penale, durata, statistiche-giudiziarie]
  category: giustizia
  years: [2025]
  time_coverage:
    start_year: 2014
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "durate_medie_csv"
      type: "http_file"
      args:
        url: "https://datiestatistiche.giustizia.it/cmsresources/cms/documents/Durate_medie_penali_20142025.csv"
        filename: "Durate_medie_penali_20142025.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
  required_columns: [dettaglio_territoriale, ufficio, sezione_ufficio, anno, durata_media_gg]
  validate:
    min_rows: 15000
    not_null:
      - anno
      - ufficio
      - durata_media_gg

mart:
  tables:
    - name: "durata_penale_medie"
      sql: "sql/mart.sql"
  required_tables:
    - "durata_penale_medie"
  validate:
    table_rules:
      durata_penale_medie:
        primary_key: [anno, dettaglio_territoriale, ufficio, distretto, sede, sezione_ufficio]
        min_rows: 10000

validation:
  fail_on_error: true
