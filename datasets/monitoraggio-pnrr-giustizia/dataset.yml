# Candidate: monitoraggio-pnrr-giustizia (issue #3)
# Fonte: Ministero della Giustizia - DG Statistica
# URL: https://datiestatistiche.giustizia.it/page/it/monitoraggio_integrato_pnrr_uffici_processo
# File: Monitoraggio_PNRR_Dati_civili.csv + Monitoraggio_PNRR_Dati_penali.csv
# Script: unite_pnrr.py — unisce i due CSV (stesso grano; i civili hanno
#         arretrato + target PNRR 2024/2026, il penale no).
# Copertura: 2019-2025 "Intero anno" + 2026 "Primo semestre".

root: "../../out"
schema_version: 1

dataset:
  name: "monitoraggio_pnrr_giustizia"
  source_id: "giustizia_statistiche"
  tags: [giustizia, pnrr, pendenti, arretrato, statistiche-giudiziarie]
  category: giustizia
  years: [2026]
  time_coverage:
    start_year: 2019
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python scripts/unite_pnrr.py --output raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    header: true
  sql: "sql/clean.sql"
  required_columns: [materia, anno, periodo, tipo_ufficio, definiti, pendenti_fine_periodo]
  validate:
    min_rows: 2700
    not_null:
      - materia
      - anno
      - periodo
      - tipo_ufficio

mart:
  tables:
    - name: "monitoraggio_pnrr_giustizia"
      sql: "sql/mart.sql"
    - name: "mart_nazionale_trend"
      sql: "sql/mart_nazionale_trend.sql"
  required_tables:
    - "monitoraggio_pnrr_giustizia"
    - "mart_nazionale_trend"
  validate:
    table_rules:
      monitoraggio_pnrr_giustizia:
        # Sede mancante solo per Cassazione (righe nazionali)
        primary_key: [anno, periodo, materia, tipo_ufficio, distretto, sede]
        min_rows: 2700
      mart_nazionale_trend:
        primary_key: [anno, periodo, materia, tipo_ufficio]
        min_rows: 40

validation:
  fail_on_error: true
