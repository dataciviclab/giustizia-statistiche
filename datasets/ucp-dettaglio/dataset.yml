# Candidate: ucp-dettaglio (issue #6)
# Fonte: Ministero della Giustizia - DG Statistica
# URL: https://datiestatistiche.giustizia.it/it/monitoraggio_ucp_upp.page
# File: UCP_2021_2025_Dettaglio_UCP.csv (cp1252, ~48 colonne)
# Script: prepare_dettaglio.py — sanifica header (snake_case) e tipi.
# Copertura: 2021-2025. Censimento organizzativo di ogni UCP istituito.
# PK: (anno, sede, identificativo_ucp) — verificata unica (741/741).

root: "../../out"
schema_version: 1

dataset:
  name: "ucp_dettaglio"
  source_id: "giustizia_statistiche"
  tags: [giustizia, penale, ucp, riforma-cartoline, statistiche-giudiziarie]
  category: giustizia
  years: [2025]
  time_coverage:
    start_year: 2021
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python scripts/prepare_dettaglio.py --output raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    header: true
  sql: "sql/clean.sql"
  required_columns: [anno, sede, identificativo_ucp, us_num, supporto]
  validate:
    min_rows: 700
    not_null:
      - anno
      - sede
      - identificativo_ucp

mart:
  tables:
    - name: "ucp_dettaglio"
      sql: "sql/mart.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - "ucp_dettaglio"
    - "mart_sintesi"
  validate:
    table_rules:
      ucp_dettaglio:
        primary_key: [anno, sede, identificativo_ucp]
        min_rows: 700
      mart_sintesi:
        primary_key: [anno, corte_appello, sede]
        min_rows: 600

validation:
  fail_on_error: true
